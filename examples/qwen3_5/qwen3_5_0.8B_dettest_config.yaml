# 确定性验证：use_deter_comp=true + 只跑 50 步，用来判断能否逐位复现。
#
# 为什么只跑 50 步
#   不加确定性时，两次运行在第 3 步就分岔了。
#   所以只要跑 50 步就能判定：要么全程逐位相同，要么再现分岔。
#   50 步的代价远低于 1816 步，结论同样有力。
#
# 与 sample8b 的差别：use_deter_comp false->true，train_iters 1816->50。
# 其余全部一致，save_interval 调大以免中途存盘。

parallel:
  tensor_parallel_size: 1
  fully_shard_parallel_size: auto
  fsdp_plan:
    apply_modules:
      - model.visual.blocks.{*}
      - model.visual
      - model.language_model.layers.{*}
      - model.language_model.embed_tokens
      - model.language_model
      - lm_head
    param_dtype: bf16
    reduce_dtype: fp32
  recompute: true
  recompute_plan:
    apply_modules:
      - model.language_model.layers.{*}
  ulysses_parallel_size: 1

data:
  dataset_param:
    dataset_type: huggingface
    attr:
      formatting: sharegpt
      images: image
      messages: conversations
      role_tag: from
      content_tag: value
      user_tag: user
      assistant_tag: assistant

    preprocess_parameters:
      model_name_or_path: &HF_META /workspace/user_data/base_meta/Qwen3.5-0.8B
      use_fast_tokenizer: true
      split_special_tokens: false
      image_max_pixels: 262144
      image_min_pixels: 1024
      video_max_pixels: 16384
      video_min_pixels: 0
      video_fps: 2.0
      video_maxlen: 64

    basic_parameters:
      cutoff_len: 1024
      template: qwen3_vl_nothink
      enable_thinking: false
      train_on_prompt: false
      mask_history: false
      dataset_dir: ./data/ecommerce_multimodal/sample5
      dataset: &DATASET_PATH ./data/ecommerce_multimodal/sample8b/train.json
      cache_dir: /workspace/cache_det_test
      overwrite_cache: false
      preprocessing_batch_size: 1000
      preprocessing_num_workers: 16
      max_samples: null

  dataloader_param:
    pin_memory: true
    shuffle: false
    dataloader_mode: sampler
    drop_last: true
    sampler_type: BaseRandomBatchSampler
    num_workers: 8
    collate_param:
      model_name: qwen3vl
      ignore_pad_token_for_loss: true

model:
  model_id: qwen3_5
  model_name_or_path: *HF_META
  trust_remote_code: true
  attn_implementation: sdpa
  freeze:
    - model.visual
  loss_cfg:
    loss_type: default
    router_aux_loss_coef: 0.0
  enable_chunk_loss: false
  chunkloss_plan:
    apply_module: lm_head
    chunk_size: 1024
  use_triton_gdn: true

training:
  micro_batch_size: 1
  gradient_accumulation_steps: 1
  seed: 42
  lr: 1.0e-5
  lr_decay_style: cosine
  lr_warmup_ratio: 0.1
  weight_decay: 0
  train_iters: 50
  clip_grad: 0.0
  init_model_with_meta_device: true
  optimizer: adamw
  adam_fused: true
  save_interval: 100000
  no_load_optim: true
  no_load_rng: true
  no_save_optim: true
  no_save_rng: true
  load: /workspace/user_data/dcp/Qwen3.5-0.8B
  save: /workspace/user_data/output/qwen3_5_0.8B_dettest
  # ↓↓↓ 唯一实质性改动：开确定性计算 ↓↓↓
  use_deter_comp: true
  plugin:
    - mindspeed_mm/fsdp/models/qwen3_5
    - mindspeed_mm/fsdp/data/datasets/huggingface

tools:
  profile:
    enable: false
