# Qwen3.5-0.8B FSDP2 SFT on the 3-category sample (watch / backpack / sneakers).
#
# Why this config exists
#   The original Qwen3.5-0.8B HF release is no longer in shared_assets, so we start
#   from the pristine DCP that was converted from it earlier:
#       /workspace/user_data/dcp/Qwen3.5-0.8B
#   model_name_or_path points at a "meta" dir that holds ONLY
#   config.json / tokenizer / processor (no safetensors), so there is no way to
#   accidentally initialise from the previously fine-tuned HF weights.
#
# Run
#   source /workspace/mindspeed_env.sh
#   cd /workspace/MindSpeed
#   bash examples/qwen3_5/train_qwen35.sh        # CONFIG overrides below
#   CONFIG=examples/qwen3_5/qwen3_5_0.8B_sample3_config.yaml bash examples/qwen3_5/train_qwen35.sh

parallel:
  tensor_parallel_size: 1
  fully_shard_parallel_size: auto
  fsdp_plan:
    apply_modules:
      - model.visual.blocks.{*}
      - model.visual
      - model.language_model.layers.{*}
      - model.language_model.embed_tokens
      - model.language_model
      - lm_head
    param_dtype: bf16
    reduce_dtype: fp32
  recompute: true
  recompute_plan:
    apply_modules:
      - model.language_model.layers.{*}
  ulysses_parallel_size: 1

data:
  dataset_param:
    dataset_type: huggingface
    attr:
      formatting: sharegpt
      images: image
      messages: conversations
      role_tag: from
      content_tag: value
      user_tag: user
      assistant_tag: assistant

    preprocess_parameters:
      # meta dir: config + tokenizer + processor only, NO weights
      model_name_or_path: &HF_META /workspace/user_data/base_meta/Qwen3.5-0.8B
      use_fast_tokenizer: true
      split_special_tokens: false
      image_max_pixels: 262144
      image_min_pixels: 1024
      video_max_pixels: 16384
      video_min_pixels: 0
      video_fps: 2.0
      video_maxlen: 64

    basic_parameters:
      cutoff_len: 1024
      template: qwen3_vl_nothink
      enable_thinking: false
      train_on_prompt: false
      mask_history: false
      # 数据随仓库一起分发，路径就是它在仓库里的真实位置
      dataset_dir: ./data/ecommerce_multimodal/sample3
      dataset: &DATASET_PATH ./data/ecommerce_multimodal/sample3/train.json
      cache_dir: /workspace/user_data/cache_sample3
      overwrite_cache: false
      preprocessing_batch_size: 1000
      preprocessing_num_workers: 16
      max_samples: null

  dataloader_param:
    pin_memory: true
    shuffle: false
    dataloader_mode: sampler
    drop_last: true
    sampler_type: BaseRandomBatchSampler
    num_workers: 8
    collate_param:
      model_name: qwen3vl
      ignore_pad_token_for_loss: true

model:
  model_id: qwen3_5
  model_name_or_path: *HF_META
  trust_remote_code: true
  attn_implementation: sdpa
  freeze:
    - model.visual
  loss_cfg:
    loss_type: default
    router_aux_loss_coef: 0.0
  enable_chunk_loss: false
  chunkloss_plan:
    apply_module: lm_head
    chunk_size: 1024
  use_triton_gdn: true

training:
  micro_batch_size: 1
  gradient_accumulation_steps: 1
  seed: 42
  lr: 1.0e-5
  lr_decay_style: cosine
  lr_warmup_ratio: 0.1
  weight_decay: 0
  train_iters: 1260          # 628 training samples, about 2 epochs at micro_batch_size=1
  clip_grad: 0.0
  init_model_with_meta_device: true
  optimizer: adamw
  adam_fused: true
  save_interval: 630
  no_load_optim: true
  no_load_rng: true
  no_save_optim: true
  no_save_rng: true
  # pristine base weights (converted from the original 0.8B release)
  load: /workspace/user_data/dcp/Qwen3.5-0.8B
  save: /workspace/user_data/output/qwen3_5_0.8B_sample3
  use_deter_comp: false
  plugin:
    - mindspeed_mm/fsdp/models/qwen3_5
    - mindspeed_mm/fsdp/data/datasets/huggingface

tools:
  profile:
    enable: false
    profile_type: static
    ranks: [0]
    static_param:
      level: level1
      with_stack: false
      with_memory: false
      record_shapes: false
      with_cpu: true
      save_path: ./profiling
      start_step: 10
      end_step: 11
      data_simplification: false
      aic_metrics_type: PipeUtilization
  memory_profile:
    enable: false
    start_step: 1
    end_step: 2
    save_path: ./memory_snapshot
    dump_ranks: [0]
    stacks: all
    max_entries: null
    mem_info: false
