# Qwen3.5-0.8B FSDP2 SFT on sample8b（闭词表可靠属性 + 散文去色）
#
# 这条线是怎么走到这里的
#   1) 原目标"列出 3-5 个可见结构特征"是**欠定**的：两个老师同一问法只有
#      13.3% 完全一致，模型逐字复现率 0.138 —— 目标本身就不公平。
#   2) 换成闭词表互斥判断题（鞋帮高度/开合方式/有无侧袋…），
#      两老师一致率 13.3% -> 91.2%。
#   3) 再用 855 张重估"信息量"，剔掉取值单一的属性（一致率高但没有区分度），
#      留下 16 个属性 / 11 个品类，多数类基线 0.43-0.83（有真实区分度）。
#   4) 答案散文里原本还残留颜色断言（整条答案 26.8% 含颜色词，
#      来自 subagent 按子样式写的模板），已按句删除 -> 0.0000。
#
# 数据集
#   39 个子样式 / 570 张图 / 训练 908 条 / 验证 232 条
#   每张图的视觉从句 = 品类 + 1~3 个闭词表属性值 + 场景
#   从句可被 attr_render 精确反解回属性（往返 570/570 = 1.000），
#   所以评测能算**平衡准确率**，而不是被 0.807 的多数类基线糊弄过去。

parallel:
  tensor_parallel_size: 1
  fully_shard_parallel_size: auto
  fsdp_plan:
    apply_modules:
      - model.visual.blocks.{*}
      - model.visual
      - model.language_model.layers.{*}
      - model.language_model.embed_tokens
      - model.language_model
      - lm_head
    param_dtype: bf16
    reduce_dtype: fp32
  recompute: true
  recompute_plan:
    apply_modules:
      - model.language_model.layers.{*}
  ulysses_parallel_size: 1

data:
  dataset_param:
    dataset_type: huggingface
    attr:
      formatting: sharegpt
      images: image
      messages: conversations
      role_tag: from
      content_tag: value
      user_tag: user
      assistant_tag: assistant

    preprocess_parameters:
      model_name_or_path: &HF_META /workspace/user_data/base_meta/Qwen3.5-0.8B
      use_fast_tokenizer: true
      split_special_tokens: false
      image_max_pixels: 262144
      image_min_pixels: 1024
      video_max_pixels: 16384
      video_min_pixels: 0
      video_fps: 2.0
      video_maxlen: 64

    basic_parameters:
      cutoff_len: 1024
      template: qwen3_vl_nothink
      enable_thinking: false
      train_on_prompt: false
      mask_history: false
      dataset_dir: ./data/ecommerce_multimodal/sample5
      dataset: &DATASET_PATH ./data/ecommerce_multimodal/sample8b/train.json
      # 缓存放本地 overlay，glusterfs 上会撞 Errno 107
      cache_dir: /workspace/cache_sample8b
      overwrite_cache: false
      preprocessing_batch_size: 1000
      preprocessing_num_workers: 16
      max_samples: null

  dataloader_param:
    pin_memory: true
    shuffle: false
    dataloader_mode: sampler
    drop_last: true
    sampler_type: BaseRandomBatchSampler
    num_workers: 8
    collate_param:
      model_name: qwen3vl
      ignore_pad_token_for_loss: true

model:
  model_id: qwen3_5
  model_name_or_path: *HF_META
  trust_remote_code: true
  attn_implementation: sdpa
  freeze:
    - model.visual
  loss_cfg:
    loss_type: default
    router_aux_loss_coef: 0.0
  enable_chunk_loss: false
  chunkloss_plan:
    apply_module: lm_head
    chunk_size: 1024
  use_triton_gdn: true

training:
  micro_batch_size: 1
  gradient_accumulation_steps: 1
  seed: 42
  lr: 1.0e-5
  lr_decay_style: cosine
  lr_warmup_ratio: 0.1
  weight_decay: 0
  # 908 条训练样本，2 个 epoch
  train_iters: 1816
  clip_grad: 0.0
  init_model_with_meta_device: true
  optimizer: adamw
  adam_fused: true
  save_interval: 908
  no_load_optim: true
  no_load_rng: true
  no_save_optim: true
  no_save_rng: true
  load: /workspace/user_data/dcp/Qwen3.5-0.8B
  save: /workspace/user_data/output/qwen3_5_0.8B_sample8b
  use_deter_comp: false
  plugin:
    - mindspeed_mm/fsdp/models/qwen3_5
    - mindspeed_mm/fsdp/data/datasets/huggingface

tools:
  profile:
    enable: false
    profile_type: static
    ranks: [0]
    static_param:
      level: level1
      with_stack: false
      with_memory: false
      record_shapes: false
      with_cpu: true
      save_path: ./profiling
      start_step: 10
      end_step: 11
      data_simplification: false
      aic_metrics_type: PipeUtilization
  memory_profile:
    enable: false
    start_step: 1
    end_step: 2
    save_path: ./memory_snapshot
    dump_ranks: [0]
    stacks: all
    max_entries: null
    mem_info: false
