# Qwen3.5-0.8B 微调配置（FSDP2 后端）
#
# 用法：bash examples/qwen3_5/train_qwen35.sh
#
# 说明：
#   * 模型结构（hidden_size / 层数 / vision 配置）由 model_name_or_path 下 config.json 决定，
#     所以本文件与 qwen3_5_4B_config.yaml 结构一致，只是换了路径与默认值。
#   * Qwen3.5-0.8B：text hidden 1024 / 24 层 / vision out_hidden 2048 / vocab 248320。
#   * 运行前需确认下面标了 <PATH> 的三处路径。
#   * 后端为 FSDP2 时环境变量需要 NON_MEGATRON=true（见启动脚本）。

# 并行策略
parallel:
  tensor_parallel_size: 1
  fully_shard_parallel_size: auto
  fsdp_plan:
    apply_modules:
      - model.visual.blocks.{*}
      - model.visual
      - model.language_model.layers.{*}
      - model.language_model.embed_tokens
      - model.language_model
      - lm_head
    param_dtype: bf16
    reduce_dtype: fp32
  recompute: true            # 0.8B 显存充裕，可按需关闭以提速
  recompute_plan:
    apply_modules:
      - model.language_model.layers.{*}
  ulysses_parallel_size: 1   # 开启 ulysses-cp 时需把 model 的 attn_implementation 改为 flash_attention_2

### 数据相关配置
data:
  dataset_param:
    dataset_type: huggingface
    # 数据集字段映射（电商导购数据，sharegpt 格式；映射已 dry-run 验证 2000/2000 通过）
    attr:
      formatting: sharegpt
      images: image
      messages: conversations
      role_tag: from
      content_tag: value
      user_tag: user
      assistant_tag: assistant

    # 数据预处理
    preprocess_parameters:
      # <PATH-1> 原始 HF 权重目录（0.8B），用于 tokenizer / 图像预处理
      model_name_or_path: &HF_MODEL_LOAD_PATH /workspace/shared_assets/HC2026/helloworld/model/Qwen3.5-0.8B
      use_fast_tokenizer: true
      split_special_tokens: false
      image_max_pixels: 262144
      image_min_pixels: 1024
      video_max_pixels: 16384
      video_min_pixels: 0
      video_fps: 2.0
      video_maxlen: 64

    basic_parameters:
      cutoff_len: 1024
      template: qwen3_vl_nothink
      enable_thinking: false
      train_on_prompt: false
      mask_history: false
      dataset_dir: ./data/ecommerce_multimodal
      dataset: &DATASET_PATH ./data/ecommerce_multimodal/train.json
      cache_dir: /workspace/user_data/cache_dir
      overwrite_cache: false
      preprocessing_batch_size: 1000
      preprocessing_num_workers: 16
      max_samples: null
      #
      # 数据来源：data/ecommerce_multimodal/train.json（sharegpt；2000 条样本 + images/）
      # dataset_dir 指向 images/ 的上一级，用于拼接样本里的 image 相对路径

  # 数据加载
  dataloader_param:
    pin_memory: true
    shuffle: false
    dataloader_mode: sampler
    drop_last: true
    sampler_type: BaseRandomBatchSampler
    num_workers: 8
    collate_param:
      model_name: qwen3vl
      ignore_pad_token_for_loss: true

# 模型配置
model:
  model_id: qwen3_5
  model_name_or_path: *HF_MODEL_LOAD_PATH
  trust_remote_code: true
  attn_implementation: sdpa
  freeze:
    - model.visual           # 冻结视觉编码器，仅训练语言主干；若要让视觉也训练，删掉这两行
  loss_cfg:
    loss_type: default       # 需要模型原始 loss 时可改为 "raw"
    router_aux_loss_coef: 0.0
  enable_chunk_loss: false
  chunkloss_plan:
    apply_module: lm_head
    chunk_size: 1024
  use_triton_gdn: true       # Qwen3.5 线性注意力（GatedDeltaNet）依赖 triton-ascend，见 install_extensions.sh

# 训练配置
training:
  micro_batch_size: 1
  gradient_accumulation_steps: 1
  seed: 42
  lr: 1.0e-5
  lr_decay_style: cosine
  lr_warmup_ratio: 0.1
  weight_decay: 0
  train_iters: 2000          # 数据约 2000 条，单卡 mbs=1 时约等于 1 个 epoch
  clip_grad: 0.0
  init_model_with_meta_device: true   # 配合 DCP 权重使用（权重转换见 examples/qwen3_5/README.md）
  optimizer: adamw
  adam_fused: true
  save_interval: 500
  no_load_optim: true        # 不加载优化器状态；需要断点续训时删掉
  no_load_rng: true
  no_save_optim: true        # 不保存优化器状态；需要续训时删掉
  no_save_rng: true
  # <PATH-2> 转换后的 DCP 权重目录（mm-convert Qwen35Converter hf_to_dcp 的输出，写到 release 的上一级）
  load: /workspace/user_data/dcp/Qwen3.5-0.8B
  # <PATH-3> 微调产物输出目录
  save: /workspace/user_data/output/qwen3_5_0.8B_ecommerce
  use_deter_comp: false
  plugin:
    - mindspeed_mm/fsdp/models/qwen3_5
    - mindspeed_mm/fsdp/data/datasets/huggingface

# 工具配置
tools:
  profile:
    enable: false
    profile_type: static
    ranks: [0]
    static_param:
      level: level1
      with_stack: false
      with_memory: false
      record_shapes: false
      with_cpu: true
      save_path: ./profiling
      start_step: 10
      end_step: 11
      data_simplification: false
      aic_metrics_type: PipeUtilization
  memory_profile:
    enable: false
    start_step: 1
    end_step: 2
    save_path: ./memory_snapshot
    dump_ranks: [0]
    stacks: all
    max_entries: null
    mem_info: false
