# Qwen3.5-0.8B FSDP2 SFT —— 可复现性检查用（与 sample8b 逐字相同）
#
# 与 sample8b 的唯一差别：save / cache 换成独立目录（不影响数值）。
# 数据、seed=42、train_iters=1816、lr、并行、attn_implementation(sdpa)、
# 一切数值相关设置完全一致。
#
# 目的：同一种计算的两次运行逐位比较。
#   · 若框架是确定性的 → 逐步 loss 应完全一致，相对误差 ~1e-7
#     （正是截图里 Min Error 5.08e-07 那种量级）
#   · 若不一致 → 说明存在运行间不确定性，这本身是必须知道的事
#
# 注意：这不是"两种实现对比"。sdpa vs eager 的差异是算法性的（求和顺序不同），
# 开确定性计算也消不掉，且会被训练混沌放大，所以那种比法必然发散。

parallel:
  tensor_parallel_size: 1
  fully_shard_parallel_size: auto
  fsdp_plan:
    apply_modules:
      - model.visual.blocks.{*}
      - model.visual
      - model.language_model.layers.{*}
      - model.language_model.embed_tokens
      - model.language_model
      - lm_head
    param_dtype: bf16
    reduce_dtype: fp32
  recompute: true
  recompute_plan:
    apply_modules:
      - model.language_model.layers.{*}
  ulysses_parallel_size: 1

data:
  dataset_param:
    dataset_type: huggingface
    attr:
      formatting: sharegpt
      images: image
      messages: conversations
      role_tag: from
      content_tag: value
      user_tag: user
      assistant_tag: assistant

    preprocess_parameters:
      model_name_or_path: &HF_META /workspace/user_data/base_meta/Qwen3.5-0.8B
      use_fast_tokenizer: true
      split_special_tokens: false
      image_max_pixels: 262144
      image_min_pixels: 1024
      video_max_pixels: 16384
      video_min_pixels: 0
      video_fps: 2.0
      video_maxlen: 64

    basic_parameters:
      cutoff_len: 1024
      template: qwen3_vl_nothink
      enable_thinking: false
      train_on_prompt: false
      mask_history: false
      dataset_dir: ./data/ecommerce_multimodal/sample5
      dataset: &DATASET_PATH ./data/ecommerce_multimodal/sample8b/train.json
      cache_dir: /workspace/cache_sample8b_rep
      overwrite_cache: false
      preprocessing_batch_size: 1000
      preprocessing_num_workers: 16
      max_samples: null

  dataloader_param:
    pin_memory: true
    shuffle: false
    dataloader_mode: sampler
    drop_last: true
    sampler_type: BaseRandomBatchSampler
    num_workers: 8
    collate_param:
      model_name: qwen3vl
      ignore_pad_token_for_loss: true

model:
  model_id: qwen3_5
  model_name_or_path: *HF_META
  trust_remote_code: true
  attn_implementation: sdpa
  freeze:
    - model.visual
  loss_cfg:
    loss_type: default
    router_aux_loss_coef: 0.0
  enable_chunk_loss: false
  chunkloss_plan:
    apply_module: lm_head
    chunk_size: 1024
  use_triton_gdn: true

training:
  micro_batch_size: 1
  gradient_accumulation_steps: 1
  seed: 42
  lr: 1.0e-5
  lr_decay_style: cosine
  lr_warmup_ratio: 0.1
  weight_decay: 0
  train_iters: 1816
  clip_grad: 0.0
  init_model_with_meta_device: true
  optimizer: adamw
  adam_fused: true
  save_interval: 908
  no_load_optim: true
  no_load_rng: true
  no_save_optim: true
  no_save_rng: true
  load: /workspace/user_data/dcp/Qwen3.5-0.8B
  save: /workspace/user_data/output/qwen3_5_0.8B_sample8b_rep
  use_deter_comp: false
  plugin:
    - mindspeed_mm/fsdp/models/qwen3_5
    - mindspeed_mm/fsdp/data/datasets/huggingface

tools:
  profile:
    enable: false
