# Qwen3.5-0.8B FSDP2 SFT on sample6（蒸馏：逐图答案）
#
# 与 sample5 的唯一差别：答案是【逐图】的
#   sample5: 一个子样式的 15 张图共用一段答案 → 不看图也能把 loss 压到 0.03
#   sample6: 「图中为…」这一段换成该图自己的 VLM 属性（颜色/部件/画面），其余照旧
#            → 描述部分逐图不同，背模板不再能达标
#
# 图片仍在 sample5/images 下，所以 dataset_dir 指向 sample5。

parallel:
  tensor_parallel_size: 1
  fully_shard_parallel_size: auto
  fsdp_plan:
    apply_modules:
      - model.visual.blocks.{*}
      - model.visual
      - model.language_model.layers.{*}
      - model.language_model.embed_tokens
      - model.language_model
      - lm_head
    param_dtype: bf16
    reduce_dtype: fp32
  recompute: true
  recompute_plan:
    apply_modules:
      - model.language_model.layers.{*}
  ulysses_parallel_size: 1

data:
  dataset_param:
    dataset_type: huggingface
    attr:
      formatting: sharegpt
      images: image
      messages: conversations
      role_tag: from
      content_tag: value
      user_tag: user
      assistant_tag: assistant

    preprocess_parameters:
      model_name_or_path: &HF_META /workspace/user_data/base_meta/Qwen3.5-0.8B
      use_fast_tokenizer: true
      split_special_tokens: false
      image_max_pixels: 262144
      image_min_pixels: 1024
      video_max_pixels: 16384
      video_min_pixels: 0
      video_fps: 2.0
      video_maxlen: 64

    basic_parameters:
      cutoff_len: 1024
      template: qwen3_vl_nothink
      enable_thinking: false
      train_on_prompt: false
      mask_history: false
      # 图片在 sample5 下，标签在 sample6 下
      dataset_dir: ./data/ecommerce_multimodal/sample5
      dataset: &DATASET_PATH ./data/ecommerce_multimodal/sample6/train.json
      # 注意：缓存放在本地 overlay，不放 glusterfs。
      # 预处理会产生大量小文件，实测在 glusterfs 上会撞到
      # "OSError: [Errno 107] Transport endpoint is not connected"。
      cache_dir: /workspace/cache_sample6
      overwrite_cache: false
      preprocessing_batch_size: 1000
      preprocessing_num_workers: 16
      max_samples: null

  dataloader_param:
    pin_memory: true
    shuffle: false
    dataloader_mode: sampler
    drop_last: true
    sampler_type: BaseRandomBatchSampler
    num_workers: 8
    collate_param:
      model_name: qwen3vl
      ignore_pad_token_for_loss: true

model:
  model_id: qwen3_5
  model_name_or_path: *HF_META
  trust_remote_code: true
  attn_implementation: sdpa
  freeze:
    - model.visual
  loss_cfg:
    loss_type: default
    router_aux_loss_coef: 0.0
  enable_chunk_loss: false
  chunkloss_plan:
    apply_module: lm_head
    chunk_size: 1024
  use_triton_gdn: true

training:
  micro_batch_size: 1
  gradient_accumulation_steps: 1
  seed: 42
  lr: 1.0e-5
  lr_decay_style: cosine
  lr_warmup_ratio: 0.1
  weight_decay: 0
  # 1176 条训练样本，2 个 epoch（sample4 的实验已证明 1 个 epoch 不够）
  train_iters: 2352
  clip_grad: 0.0
  init_model_with_meta_device: true
  optimizer: adamw
  adam_fused: true
  save_interval: 1176
  no_load_optim: true
  no_load_rng: true
  no_save_optim: true
  no_save_rng: true
  load: /workspace/user_data/dcp/Qwen3.5-0.8B
  save: /workspace/user_data/output/qwen3_5_0.8B_sample6
  use_deter_comp: false
  plugin:
    - mindspeed_mm/fsdp/models/qwen3_5
    - mindspeed_mm/fsdp/data/datasets/huggingface

tools:
  profile:
    enable: false
    profile_type: static
    ranks: [0]
    static_param:
      level: level1
      with_stack: false
      with_memory: false
      record_shapes: false
      with_cpu: true
      save_path: ./profiling
      start_step: 10
      end_step: 11
      data_simplification: false
      aic_metrics_type: PipeUtilization
  memory_profile:
    enable: false
    start_step: 1
    end_step: 2
    save_path: ./memory_snapshot
    dump_ranks: [0]
    stacks: all
    max_entries: null
    mem_info: false
